services:
  app:
    build:
      context: .
      target: development
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    command:
      - uvicorn
      - app.main:app
      - --host=0
      - --port=8080
      - --log-level=debug
      - --reload



  db:
    image: postgres:11.13-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    volumes:
      - test-db-data:/var/lib/postgresql/data

volumes:
  test-db-data:
